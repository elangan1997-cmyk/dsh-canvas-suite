name: Windows 安装器验证

on:
  workflow_dispatch:
  push:
    branches: [ci/windows-installer-smoke-20260903]
    paths:
      - 'windows-installer/sfx-stub.cs'
      - '.github/workflows/install-test.yml'

permissions:
  contents: read

jobs:
  installer-smoke:
    name: 自解压与安装阶段（Windows）
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构造测试安装包
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'dsh-installer-smoke'
          New-Item -ItemType Directory -Force -Path $root, (Join-Path $root 'payload') | Out-Null
          Set-Content -LiteralPath (Join-Path $root 'payload\install-release.ps1') -Value "Set-Content -LiteralPath (Join-Path `$env:TEMP 'dsh-ci-install-marker.txt') -Value 'install-ok' -Encoding UTF8; exit 0" -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $root 'payload\fixture.txt') -Value 'fixture' -Encoding UTF8
          Compress-Archive -Path (Join-Path $root 'payload\*') -DestinationPath (Join-Path $root 'payload.zip') -CompressionLevel Fastest
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $compression = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\System.IO.Compression.dll'
          $compressionFs = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\System.IO.Compression.FileSystem.dll'
          $forms = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\System.Windows.Forms.dll'
          $stub = Join-Path $root 'stub.exe'
          & $csc /nologo /target:exe /optimize+ /out:$stub /reference:$compression /reference:$compressionFs /reference:$forms (Join-Path $env:GITHUB_WORKSPACE 'windows-installer\sfx-stub.cs')
          if ($LASTEXITCODE -ne 0) { throw "csc exit $LASTEXITCODE" }
          $marker = [Text.Encoding]::ASCII.GetBytes("DSH_PAYLOAD_V1`n")
          $output = [IO.File]::Open((Join-Path $env:GITHUB_WORKSPACE 'setup.exe'), [IO.FileMode]::Create)
          try {
            $stubIn = [IO.File]::OpenRead($stub); try { $stubIn.CopyTo($output) } finally { $stubIn.Dispose() }
            $output.Write($marker, 0, $marker.Length)
            $zipIn = [IO.File]::OpenRead((Join-Path $root 'payload.zip')); try { $zipIn.CopyTo($output) } finally { $zipIn.Dispose() }
          } finally { $output.Dispose() }
          Write-Host "测试安装包大小: $((Get-Item (Join-Path $env:GITHUB_WORKSPACE 'setup.exe')).Length) bytes"

      - name: 验证实时解压进度
        env:
          DSH_SFX_TEST: '3'
        run: |
          $ErrorActionPreference = 'Stop'
          & .\setup.exe 2>&1 | Tee-Object -FilePath extraction.log
          if ($LASTEXITCODE -ne 0) { throw "解压测试退出码: $LASTEXITCODE" }
          $text = Get-Content -LiteralPath extraction.log -Raw -Encoding UTF8
          if ($text -notmatch '\[1/3\].*100%') { throw '未显示准备阶段 100%' }
          if ($text -notmatch '\[2/3\].*100%') { throw '未显示解压阶段 100%' }
          if ($text -notmatch '\[3/3\] 解压验证完成') { throw '未显示解压完成阶段' }
          Write-Host '实时解压进度验证通过'

      - name: 验证安装阶段和退出码
        run: |
          $ErrorActionPreference = 'Stop'
          $marker = Join-Path $env:TEMP 'dsh-ci-install-marker.txt'
          Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
          & .\setup.exe 2>&1 | Tee-Object -FilePath install.log
          if ($LASTEXITCODE -ne 0) { throw "安装阶段退出码: $LASTEXITCODE" }
          if ((Get-Content -LiteralPath install.log -Raw -Encoding UTF8) -notmatch '\[3/3\] DSH Desktop 安装完成') { throw '未显示安装完成阶段' }
          if (((Get-Content -LiteralPath $marker -Raw -ErrorAction SilentlyContinue).Trim()) -ne 'install-ok') { throw '测试安装脚本未执行' }
          Write-Host '安装阶段和退出码验证通过'

      - name: 上传验证日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-smoke-logs
          path: |
            extraction.log
            install.log

